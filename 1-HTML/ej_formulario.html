<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
    <form name="form_suscripcion">
        <fieldset>
            <legend>Datos personales</legend>
            <p> Nombre:
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="ingrese su nombre">
            </p>
            <p>
                <label for=" Apellido"> Apellido </label>
                <input type="text" id="Apellido" name="apellido" placeholder="ingrese su apellido">
            </p>
            <p>
                Sexo:
                <label for="masculino"> Masculino </label>
                <input type="radio" id="masculino" name="genero" value="Masculino">
                <label for="femenino">Femenino</label>
                <input type="radio" id="femenino" name="genero" value="Femenino">
            </p>
            <p>
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" placeholder="Edad">
            </p>
            <p>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" placeholder="usuario@dominio.com">
            </p>
        </fieldset>
        <fieldset>
            <legend>Datos de la cuenta</legend>
            <p>
                <label for="usuario"> Usuario: </label>
                <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario">
            </p>
            <p>
                <label for="password"> Password: </label>
                <input type="password" id="password" name="password" placeholder="contraseña">
            </p>
            <p>
                <label for="segunda-password"> Confirmar Password: </label>
                <input type="password" id="segunda-password" name="password-confirmar" placeholder="contraseña">
            </p>
        </fieldset>
        <fieldset>
            <legend>Tipo de suscripcion</legend>
            <p>
                <label for="tipo-servicio">Tipo de servicio: </label>
                <select name="tipo-servicio" id="tipo-servicio">
                    <option value="Free">Free </option>
                    <option value="Standard">Standard </option>
                    <option value="Premium">Premium </option>
                </select>
            </p>
            <p>
                <label for="tema"> Tema: </label>
                <label for="politica">Política </label>
                <input type="checkbox" id="politica" value="politica">
                <label for="" negocio"> Negocios </label>
                <input type="checkbox" id="negocio" value="Negocios">
                <label for="tecnologia"> Tecnología </label>
                <input type="checkbox" id="salud" value="Tecnología">
                <label for="salud"> Salud </label>
                <input type="checkbox" id="salud" value="Salud">
            </p>
        </fieldset>
        <p>
            <label for="comentario"> Agregue un comentario: </label>
            <textarea id="comentario">
           DEJE SU COMENTARIO 
            </textarea>
        </p>
        <p>
            <button type="button">
                Boton de Enviar
            </button>
        </p>
    </form>
</body>

</html>
